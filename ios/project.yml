name: HouseScan
options:
  bundleIdPrefix: local.wrcrooks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  HouseScan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HouseScan
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.wrcrooks.housescan
        INFOPLIST_FILE: HouseScan/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: RoomPlan.framework
      - sdk: ARKit.framework
      - sdk: RealityKit.framework

schemes:
  HouseScan:
    build:
      targets:
        HouseScan: all
    archive:
      config: Release
